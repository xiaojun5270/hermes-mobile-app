name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - ios-v*

permissions:
  contents: read

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS app without code signing
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npx jest --runInBand

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build the unsigned app
        shell: bash
        run: |
          set -euo pipefail

          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [[ -z "$workspace" ]]; then
            echo "No Xcode workspace was generated by Expo Prebuild." >&2
            exit 1
          fi

          scheme="$(basename "$workspace" .xcworkspace)"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build

      - name: Package the IPA
        shell: bash
        run: |
          set -euo pipefail

          app_path="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "The Release build did not produce an iOS app bundle." >&2
            exit 1
          fi

          mkdir -p output/Payload
          cp -R "$app_path" output/Payload/
          (
            cd output
            ditto -c -k --sequesterRsrc --keepParent Payload ../Hermes-Mobile-unsigned.ipa
          )

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-Mobile-unsigned-${{ github.run_number }}
          path: Hermes-Mobile-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
